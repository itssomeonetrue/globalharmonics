name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: sudo apt-get install -y imagemagick
      - run: npm install
      - run: npx cap add android
      - name: Make app icon from your logo
        run: |
          convert assets/icon-only.png -resize 1024x1024 assets/icon-only.png
          npx @capacitor/assets generate --android --iconBackgroundColor '#0e0c0b' --iconBackgroundColorDark '#0e0c0b'
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalHarmonics-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
