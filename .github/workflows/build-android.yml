name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: npm install
      - run: npx cap add android
      - name: Set app icon from your logo (will not break the build)
        continue-on-error: true
        run: |
          R=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            convert assets/icon-only.png -resize ${2}x${2} -background none -gravity center -extent ${2}x${2} $R/mipmap-$1/ic_launcher.png
            convert assets/icon-only.png -resize ${2}x${2} -background none -gravity center -extent ${2}x${2} $R/mipmap-$1/ic_launcher_round.png
            convert assets/icon-only.png -resize ${3}x${3} -background none -gravity center -extent ${3}x${3} $R/mipmap-$1/ic_launcher_foreground.png
          done
          rm -rf $R/mipmap-anydpi-v26
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: GlobalHarmonics-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
